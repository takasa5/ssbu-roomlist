<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>とし部屋@SSBU</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://use.fontawesome.com/releases/v5.1.0/css/all.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" media="screen" href="/static/main.css?1" />
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.4/socket.io.js"></script>
</head>
<body>
    <h1 style="text-align: center">とし部屋</h1>
    <div id="display">
    </div>
    <hr>
    <div id="app">
        <h2 style="text-align: center">部屋リスト</h2>
        <div v-if="roomList.length == 0" style="text-align: center">現在立っている部屋はありません。</div>
        <room-list
            v-for="room in roomList"
            v-bind:key="room.key"
            v-bind:room="room"
        ></room-list>
    </div>
    <script src="/static/main.js?1"></script>
    <footer>2019</footer>
</body>
</html>
